{% extends 'gestion/base.html' %}

{% block title %}Restablecer Contraseña{% endblock %}

{% block content %}
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h2>Restablecer Contraseña</h2>
                </div>
                <div class="card-body">
                    <p>Ingresa tu dirección de correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100">Enviar Correo de Recuperación</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
