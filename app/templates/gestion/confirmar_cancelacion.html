{% extends 'gestion/base.html' %}

{% block title %}Confirmar Cancelación{% endblock %}

{% block content %}
    <div class="text-center">
        <h2>¿Estás seguro?</h2>
        <p>Estás a punto de cancelar la cita para <strong>{{ cita.paciente.nombre }}</strong> del {{ cita.fecha_hora }}.</p>
        <form class="confirmation-form" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, Cancelar Cita</button>
            <a href="{% url 'calendario_citas' %}" class="btn btn-secondary">No, volver</a>
        </form>
    </div>
{% endblock %}
