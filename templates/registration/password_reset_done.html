{% extends 'gestion/base.html' %}

{% block title %}Correo Enviado{% endblock %}

{% block content %}
    <div class="row justify-content-center mt-5">
        <div class="col-md-8 text-center">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title">¡Correo Enviado!</h2>
                    <p class="card-text">Te hemos enviado un correo con un enlace para restablecer tu contraseña. Si no lo ves, por favor revisa tu carpeta de spam.</p>
                    <a href="{% url 'portal' %}" class="btn btn-primary mt-3">Volver al Portal</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
